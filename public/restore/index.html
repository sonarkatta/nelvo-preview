<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light"><title>Restore backup | TAARV</title>
<style>html,body{margin:0;background:#fbfbfd;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:64px 22px}h1{font-size:40px;letter-spacing:-.03em;margin:0 0 10px;text-align:center}p.l{color:#6e6e73;font-size:17px;line-height:1.5;text-align:center;margin:0 0 28px}.c{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:22px;padding:22px;box-shadow:0 10px 34px rgba(0,0,0,.06);display:grid;gap:14px}label{font-size:13px;color:#6e6e73;font-weight:600}input[type=file],input[type=password]{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.14);background:#fff;font-size:16px}button{padding:14px 22px;border-radius:14px;border:0;background:#1d1d1f;color:#fff;font-size:16px;font-weight:600;cursor:pointer}button:disabled{opacity:.5}#s{min-height:22px;font-size:14px;color:#6e6e73;text-align:center}#s.e{color:#b3382b}#s.o{color:#1d7a3a}</style></head>
<body><main><h1>Restore backup</h1><p class="l">Pick an encrypted .enc file from your private backup repo, enter the password, and get the original file back. Everything runs in your browser.</p>
<form class="c" id="f"><div><label for="file">Encrypted file (.enc)</label><input id="file" type="file" accept=".enc" required></div><div><label for="pw">Password</label><input id="pw" type="password" autocomplete="off" required></div><button id="b">Decrypt and download</button><div id="s"></div></form></main>
<script>
var f=document.getElementById('f'),s=document.getElementById('s'),b=document.getElementById('b');
function msg(t,c){s.textContent=t;s.className=c||''}
f.onsubmit=async function(e){e.preventDefault();b.disabled=true;msg('Decrypting... this can take a few seconds');
try{var file=document.getElementById('file').files[0];var all=new Uint8Array(await file.arrayBuffer());
if(all.length<45)throw new Error('bad');
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveKey']);
var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:all.slice(0,16),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));
var name=file.name.replace(/\.enc$/,'').replace(/^\d+-/,'');
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pt],{type:'application/octet-stream'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
msg('Done. Saved as '+name,'o')}catch(x){msg('Wrong password or not a valid backup file','e')}
b.disabled=false};
</script></body></html>
