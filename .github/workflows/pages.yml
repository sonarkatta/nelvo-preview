name: Deploy gated preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q 13-night-review-final.zip -d public
      - run: unzip -qo 1-nelvo-av-studio.zip -d public
      - run: unzip -qo 2-nelvo-gov-doc-sizer-gated.zip -d public
      - run: unzip -qo 2-taarv-small-header-r1.zip -d public
      - run: unzip -qo 1-taarv-master-preview.zip -d public
      - run: unzip -qo 1-taarv-script-fix.zip -d public
      - run: unzip -qo 2-taarv-visual-fix.zip -d public
      - run: unzip -qo 1-taarv-boundary-fix-r2.zip -d public
      
      - run: unzip -qo 1-1-taarv-boundary-fix-r2.zip -d public
      
      - run: unzip -qo 1-format-changer-deploy.zip -d public
      
      - run: for z in *override-*.zip; do unzip -qo $z -d public; done 
      
      - run: cp 1-logo-master.png logo-master.png && cp 2-logo-512.png logo-512.png && cp 3-favicon-64.png favicon-64.png && python3 4-fav.py && python3 1-fav2.py




      - name: Clear wordmark from unchanged tagline
        run: |
          find public -name "*.html" -exec sed -i 's/width:830px;height:auto;max-width:100%;margin:auto/width:830px;height:auto;max-width:100%;margin:auto;transform:translateY(clamp(-24px,-2vw,-8px))/g' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
